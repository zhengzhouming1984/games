<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEON BREAKOUT</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0a1a;
    font-family: 'Courier New', monospace;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas {
    display: block;
    cursor: none;
    image-rendering: auto;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
// ============================================================
//  NEON BREAKOUT — Cyberpunk Arkanoid
//  Pure HTML5 Canvas + Vanilla JS, 60fps
// ============================================================

// ---------- DOM Setup ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// ---------- Responsive Sizing ----------
const GAME_WIDTH  = 800;
const GAME_HEIGHT = 600;

function resize() {
  const scale = Math.min(
    window.innerWidth  / GAME_WIDTH,
    window.innerHeight / GAME_HEIGHT
  );
  canvas.width  = GAME_WIDTH;
  canvas.height = GAME_HEIGHT;
  canvas.style.width  = Math.floor(GAME_WIDTH  * scale) + 'px';
  canvas.style.height = Math.floor(GAME_HEIGHT * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// ============================================================
//  CONSTANTS
// ============================================================
const PI = Math.PI;
const TWO_PI = PI * 2;

// Brick config: [color, glowColor, hp, points, rows]
const BRICK_TYPES = [
  { color: '#ff0044', glow: '#ff3366', hp: 1, points: 10, rows: 2 },  // Red
  { color: '#ff6600', glow: '#ff8833', hp: 1, points: 20, rows: 1 },  // Orange
  { color: '#ffcc00', glow: '#ffdd44', hp: 1, points: 30, rows: 1 },  // Yellow
  { color: '#00ff44', glow: '#44ff77', hp: 2, points: 40, rows: 1 },  // Green (2HP)
  { color: '#0088ff', glow: '#44aaff', hp: 1, points: 50, rows: 1 },  // Blue
];

const BRICK_COLS = 10;
const BRICK_W = 68;
const BRICK_H = 22;
const BRICK_PAD = 4;
const BRICK_OFFSET_TOP = 80;
const BRICK_OFFSET_LEFT = (GAME_WIDTH - BRICK_COLS * (BRICK_W + BRICK_PAD) + BRICK_PAD) / 2;

// Power-up types
const POWERUP_TYPES = {
  WIDE:   { name: 'WIDE',   color: '#00ffff', glow: '#00ffff', icon: '⬅➡' },
  MULTI:  { name: 'MULTI',  color: '#ffffff', glow: '#ffffff', icon: '●●'  },
  SLOW:   { name: 'SLOW',   color: '#ffcc00', glow: '#ffcc00', icon: '⬇'   },
};

const POWERUP_DROP_CHANCE = 0.15;
const POWERUP_FALL_SPEED  = 2.5;
const POWERUP_SIZE        = 14;

// Paddle
const PADDLE_W_BASE   = 120;
const PADDLE_H         = 14;
const PADDLE_Y         = GAME_HEIGHT - 50;
const PADDLE_SPEED     = 8;
const PADDLE_WIDE_MULT = 1.5;
const PADDLE_WIDE_DUR  = 15 * 60; // frames

// Ball
const BALL_RADIUS      = 6;
const BALL_SPEED_BASE  = 5;
const BALL_SPEED_SLOW  = 2.5;
const BALL_SLOW_DUR    = 10 * 60; // frames
const MAX_BALLS        = 3;

// Lives
const START_LIVES = 3;

// Particles
const MAX_PARTICLES = 400;
const TRAIL_LENGTH  = 8;

// Game state enum
const STATE = { START: 0, PLAYING: 1, LEVEL_DONE: 2, GAME_OVER: 3 };

// ============================================================
//  GAME STATE
// ============================================================
let gameState   = STATE.START;
let score       = 0;
let highScore   = parseInt(localStorage.getItem('neonBreakoutHighScore')) || 0;
let lives       = START_LIVES;
let level       = 1;
let frameCount  = 0;
let shakeAmount = 0;

// Flash effect when score hits milestone
let flashAlpha  = 0;
let flashTarget = 0;

// ============================================================
//  PARTICLE POOL
// ============================================================
class Particle {
  constructor() {
    this.active = false;
    this.x = 0; this.y = 0;
    this.vx = 0; this.vy = 0;
    this.life = 0; this.maxLife = 0;
    this.color = '#fff';
    this.glow  = '#fff';
    this.size = 2;
  }

  /** Spawn a particle */
  spawn(x, y, vx, vy, life, color, glow, size) {
    this.active = true;
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life;
    this.color = color;
    this.glow  = glow;
    this.size  = size || 2;
  }

  update() {
    if (!this.active) return;
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.08; // gravity on particles
    this.life--;
    if (this.life <= 0) this.active = false;
  }

  draw(ctx) {
    if (!this.active) return;
    const alpha = this.life / this.maxLife;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = this.glow;
    ctx.shadowBlur  = 6 * alpha;
    ctx.fillStyle   = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * alpha, 0, TWO_PI);
    ctx.fill();
    ctx.restore();
  }
}

// Pool
const particlePool = [];
for (let i = 0; i < MAX_PARTICLES; i++) {
  particlePool.push(new Particle());
}

function getParticle() {
  for (const p of particlePool) {
    if (!p.active) return p;
  }
  // If pool exhausted, reuse oldest
  return particlePool[0];
}

/** Spawn an explosion burst */
function spawnExplosion(x, y, color, glow, count = 12) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * TWO_PI;
    const speed = 1 + Math.random() * 4;
    const p = getParticle();
    p.spawn(
      x, y,
      Math.cos(angle) * speed,
      Math.sin(angle) * speed - 1,
      15 + Math.floor(Math.random() * 20),
      color, glow,
      1.5 + Math.random() * 3
    );
  }
}

/** Spawn ball trail particle */
function spawnTrail(x, y) {
  const p = getParticle();
  p.spawn(
    x, y,
    (Math.random() - 0.5) * 0.5,
    (Math.random() - 0.5) * 0.5,
    6 + Math.floor(Math.random() * 6),
    '#ffffff', '#ffffff',
    1 + Math.random() * 2
  );
}

// ============================================================
//  POWER-UP CLASS
// ============================================================
class PowerUp {
  constructor() {
    this.active  = false;
    this.x       = 0;
    this.y       = 0;
    this.type    = null; // POWERUP_TYPES key
    this.glowPulse = 0;
  }

  spawn(x, y, typeKey) {
    this.active = true;
    this.x = x;
    this.y = y;
    this.type = typeKey;
    this.glowPulse = 0;
  }

  update() {
    if (!this.active) return;
    this.y += POWERUP_FALL_SPEED;
    this.glowPulse += 0.08;
    if (this.y > GAME_HEIGHT + 20) {
      this.active = false;
    }
  }

  draw(ctx) {
    if (!this.active) return;
    const cfg = POWERUP_TYPES[this.type];
    const pulse = Math.sin(this.glowPulse) * 3 + 5;

    ctx.save();
    ctx.shadowColor = cfg.glow;
    ctx.shadowBlur  = 10 + pulse;

    // Outer glow ring
    ctx.strokeStyle = cfg.color;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.7 + Math.sin(this.glowPulse) * 0.3;
    ctx.beginPath();
    const r = POWERUP_SIZE + 4;
    ctx.arc(this.x, this.y, r, 0, TWO_PI);
    ctx.stroke();

    // Inner filled diamond
    ctx.globalAlpha = 1;
    ctx.fillStyle = cfg.color;
    ctx.beginPath();
    const s = POWERUP_SIZE * 0.6;
    ctx.moveTo(this.x, this.y - s);
    ctx.lineTo(this.x + s, this.y);
    ctx.lineTo(this.x, this.y + s);
    ctx.lineTo(this.x - s, this.y);
    ctx.closePath();
    ctx.fill();

    // Center icon dot
    ctx.fillStyle = '#0a0a1a';
    ctx.beginPath();
    ctx.arc(this.x, this.y, 3, 0, TWO_PI);
    ctx.fill();

    ctx.restore();
  }
}

// Power-up instances (max 5 active at once)
const powerUps = [];
for (let i = 0; i < 5; i++) powerUps.push(new PowerUp());

function spawnPowerUp(x, y) {
  // Random type
  const keys = Object.keys(POWERUP_TYPES);
  const typeKey = keys[Math.floor(Math.random() * keys.length)];

  for (const pu of powerUps) {
    if (!pu.active) {
      pu.spawn(x, y, typeKey);
      return;
    }
  }
}

// ============================================================
//  PADDLE
// ============================================================
const paddle = {
  x: GAME_WIDTH / 2,
  y: PADDLE_Y,
  w: PADDLE_W_BASE,
  h: PADDLE_H,
  wideTimer: 0,
  targetX: GAME_WIDTH / 2,

  reset() {
    this.x = GAME_WIDTH / 2;
    this.targetX = GAME_WIDTH / 2;
    this.w = PADDLE_W_BASE;
    this.wideTimer = 0;
  },

  update() {
    // Smooth follow target (mouse/touch position)
    const dx = this.targetX - this.x;
    this.x += dx * 0.25;

    // Clamp
    const halfW = this.w / 2;
    if (this.x - halfW < 0) this.x = halfW;
    if (this.x + halfW > GAME_WIDTH) this.x = GAME_WIDTH - halfW;

    // Wide timer
    if (this.wideTimer > 0) {
      this.wideTimer--;
      if (this.wideTimer <= 0) {
        this.w = PADDLE_W_BASE;
      }
    }
  },

  draw(ctx) {
    const halfW = this.w / 2;
    const x1 = this.x - halfW;
    const y1 = this.y;
    const cornerR = this.h / 2;

    ctx.save();
    // Outer glow
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur  = 18;

    // Paddle body (rounded rect)
    const gradient = ctx.createLinearGradient(this.x, y1, this.x, y1 + this.h);
    gradient.addColorStop(0, '#00ffff');
    gradient.addColorStop(0.5, '#00ccdd');
    gradient.addColorStop(1, '#008899');
    ctx.fillStyle = gradient;

    ctx.beginPath();
    ctx.moveTo(x1 + cornerR, y1);
    ctx.lineTo(x1 + this.w - cornerR, y1);
    ctx.arcTo(x1 + this.w, y1, x1 + this.w, y1 + cornerR, cornerR);
    ctx.lineTo(x1 + this.w, y1 + this.h - cornerR);
    ctx.arcTo(x1 + this.w, y1 + this.h, x1 + this.w - cornerR, y1 + this.h, cornerR);
    ctx.lineTo(x1 + cornerR, y1 + this.h);
    ctx.arcTo(x1, y1 + this.h, x1, y1 + this.h - cornerR, cornerR);
    ctx.lineTo(x1, y1 + cornerR);
    ctx.arcTo(x1, y1, x1 + cornerR, y1, cornerR);
    ctx.closePath();
    ctx.fill();

    // Top edge highlight
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#88ffff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x1 + cornerR + 10, y1 + 2);
    ctx.lineTo(x1 + this.w - cornerR - 10, y1 + 2);
    ctx.stroke();

    // Wide indicator
    if (this.wideTimer > 0) {
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(x1 - 10, y1 - 6);
      ctx.lineTo(x1 + this.w + 10, y1 - 6);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.restore();
  },
};

// ============================================================
//  BALL
// ============================================================
class BallObj {
  constructor() {
    this.active = false;
    this.x = 0;
    this.y = 0;
    this.vx = 0;
    this.vy = 0;
    this.speed = BALL_SPEED_BASE;
    this.slowTimer = 0;
    this.trail = []; // {x, y} pairs
  }

  reset(x, y, vx, vy) {
    this.active = true;
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.speed = BALL_SPEED_BASE;
    this.slowTimer = 0;
    this.trail = [];
  }

  update() {
    if (!this.active) return;

    // Slow timer
    if (this.slowTimer > 0) {
      this.slowTimer--;
      if (this.slowTimer <= 0) {
        this.speed = BALL_SPEED_BASE;
      }
    }

    // Trail recording
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > TRAIL_LENGTH) {
      this.trail.shift();
    }

    // Spawn trail particle every other frame
    if (frameCount % 2 === 0) {
      spawnTrail(this.x, this.y);
    }

    this.x += this.vx;
    this.y += this.vy;

    // Wall bounce (left / right / top)
    if (this.x - BALL_RADIUS <= 0) {
      this.x = BALL_RADIUS;
      this.vx = Math.abs(this.vx);
      spawnExplosion(this.x, this.y, '#aa00ff', '#cc44ff', 4);
    }
    if (this.x + BALL_RADIUS >= GAME_WIDTH) {
      this.x = GAME_WIDTH - BALL_RADIUS;
      this.vx = -Math.abs(this.vx);
      spawnExplosion(this.x, this.y, '#aa00ff', '#cc44ff', 4);
    }
    if (this.y - BALL_RADIUS <= 0) {
      this.y = BALL_RADIUS;
      this.vy = Math.abs(this.vy);
      spawnExplosion(this.x, this.y, '#aa00ff', '#cc44ff', 4);
    }

    // Bottom — handled by main game loop (don't deactivate here)
  }

  /** Paddle collision */
  checkPaddle(paddle) {
    if (!this.active) return false;
    const halfW = paddle.w / 2;
    if (
      this.y + BALL_RADIUS >= paddle.y &&
      this.y - BALL_RADIUS <= paddle.y + paddle.h &&
      this.x >= paddle.x - halfW &&
      this.x <= paddle.x + halfW &&
      this.vy > 0 // only when moving down
    ) {
      // Calculate hit position ratio (-1 to 1)
      const hitPos = (this.x - paddle.x) / (halfW);
      const clamped = Math.max(-1, Math.min(1, hitPos));

      // Angle: middle goes straight up, edges go sideways
      const angle = clamped * (PI / 3); // ±60 degrees

      const currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      this.vx = Math.sin(angle) * currentSpeed;
      this.vy = -Math.cos(angle) * currentSpeed;

      // Ensure minimum vertical speed
      const minVy = currentSpeed * 0.4;
      if (Math.abs(this.vy) < minVy) {
        this.vy = -minVy;
      }

      // Push ball above paddle
      this.y = paddle.y - BALL_RADIUS;

      spawnExplosion(this.x, paddle.y, '#00ffff', '#00ffff', 6);
      return true;
    }
    return false;
  }

  /** Brick collision — returns brick row/col or null */
  checkBricks(bricks) {
    if (!this.active) return null;

    for (let r = 0; r < bricks.length; r++) {
      for (let c = 0; c < bricks[r].length; c++) {
        const brick = bricks[r][c];
        if (!brick || brick.hp <= 0) continue;

        const bx = brick.x;
        const by = brick.y;
        const bw = brick.w;
        const bh = brick.h;

        // Closest point on brick rect to ball center
        const closestX = Math.max(bx, Math.min(this.x, bx + bw));
        const closestY = Math.max(by, Math.min(this.y, by + bh));
        const distX = this.x - closestX;
        const distY = this.y - closestY;
        const distSq = distX * distX + distY * distY;

        if (distSq < BALL_RADIUS * BALL_RADIUS) {
          return { r, c, brick };
        }
      }
    }
    return null;
  }

  draw(ctx) {
    if (!this.active) return;

    // Draw trail
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      const alpha = (i + 1) / this.trail.length * 0.4;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur  = 4;
      ctx.fillStyle   = '#ffffff';
      ctx.beginPath();
      ctx.arc(t.x, t.y, BALL_RADIUS * 0.6 * (i / this.trail.length), 0, TWO_PI);
      ctx.fill();
      ctx.restore();
    }

    // Ball body
    ctx.save();
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur  = 14;

    const gradient = ctx.createRadialGradient(
      this.x - 1, this.y - 1, BALL_RADIUS * 0.2,
      this.x, this.y, BALL_RADIUS
    );
    gradient.addColorStop(0, '#ffffff');
    gradient.addColorStop(0.6, '#ccccff');
    gradient.addColorStop(1, '#8888cc');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(this.x, this.y, BALL_RADIUS, 0, TWO_PI);
    ctx.fill();

    // Inner hot spot
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(this.x - 1, this.y - 1, BALL_RADIUS * 0.3, 0, TWO_PI);
    ctx.fill();

    ctx.restore();
  }
}

// Active balls
const balls = [new BallObj()];

/** Find an inactive ball slot, or return null if max reached */
function getInactiveBall() {
  for (const b of balls) {
    if (!b.active) return b;
  }
  if (balls.length < MAX_BALLS) {
    const nb = new BallObj();
    balls.push(nb);
    return nb;
  }
  return null;
}

/** Count active balls */
function activeBallCount() {
  let c = 0;
  for (const b of balls) if (b.active) c++;
  return c;
}

/** Spawn a new ball (for multi-ball powerup) */
function cloneBallFrom(source) {
  const nb = getInactiveBall();
  if (!nb) return;
  // Slightly different angle
  const angle = Math.atan2(source.vy, source.vx) + (Math.random() - 0.5) * 0.6;
  const spd = Math.sqrt(source.vx * source.vx + source.vy * source.vy);
  nb.reset(source.x, source.y, Math.cos(angle) * spd, Math.sin(angle) * spd);
  nb.speed = source.speed;
}

// ============================================================
//  BRICK GRID
// ============================================================
let brickGrid = []; // 2D array: brickGrid[row][col] = { x, y, w, h, hp, maxHp, color, glow, points }

function buildBrickGrid() {
  const grid = [];
  let y = BRICK_OFFSET_TOP;

  for (const type of BRICK_TYPES) {
    for (let row = 0; row < type.rows; row++) {
      const brickRow = [];
      for (let col = 0; col < BRICK_COLS; col++) {
        const x = BRICK_OFFSET_LEFT + col * (BRICK_W + BRICK_PAD);
        brickRow.push({
          x, y,
          w: BRICK_W,
          h: BRICK_H,
          hp: type.hp,
          maxHp: type.hp,
          color: type.color,
          glow: type.glow,
          points: type.points,
        });
      }
      grid.push(brickRow);
      y += BRICK_H + BRICK_PAD;
    }
  }
  return grid;
}

function drawBricks(ctx) {
  for (const row of brickGrid) {
    for (const brick of row) {
      if (!brick || brick.hp <= 0) continue;

      ctx.save();
      ctx.shadowColor = brick.glow;
      ctx.shadowBlur  = 8;

      // Main body
      const gradient = ctx.createLinearGradient(brick.x, brick.y, brick.x, brick.y + brick.h);
      gradient.addColorStop(0, brick.color);
      gradient.addColorStop(1, brick.glow);
      ctx.fillStyle = gradient;

      const r = 3;
      const bx = brick.x, by = brick.y, bw = brick.w, bh = brick.h;
      ctx.beginPath();
      ctx.moveTo(bx + r, by);
      ctx.lineTo(bx + bw - r, by);
      ctx.arcTo(bx + bw, by, bx + bw, by + r, r);
      ctx.lineTo(bx + bw, by + bh - r);
      ctx.arcTo(bx + bw, by + bh, bx + bw - r, by + bh, r);
      ctx.lineTo(bx + r, by + bh);
      ctx.arcTo(bx, by + bh, bx, by + bh - r, r);
      ctx.lineTo(bx, by + r);
      ctx.arcTo(bx, by, bx + r, by, r);
      ctx.closePath();
      ctx.fill();

      // Top highlight
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(bx + 4, by + 1, bw - 8, bh * 0.35);

      // HP indicator for 2HP bricks
      if (brick.maxHp === 2 && brick.hp === 1) {
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 3]);
        ctx.beginPath();
        ctx.moveTo(bx + 5, by + bh / 2);
        ctx.lineTo(bx + bw - 5, by + bh / 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      ctx.restore();
    }
  }
}

function allBricksCleared() {
  for (const row of brickGrid) {
    for (const brick of row) {
      if (brick && brick.hp > 0) return false;
    }
  }
  return true;
}

// ============================================================
//  BACKGROUND (Stars + Neon City)
// ============================================================
const stars = [];
for (let i = 0; i < 120; i++) {
  stars.push({
    x: Math.random() * GAME_WIDTH,
    y: Math.random() * GAME_HEIGHT,
    r: 0.3 + Math.random() * 1.5,
    twinkle: Math.random() * TWO_PI,
    speed: 0.002 + Math.random() * 0.008,
  });
}

// City silhouette points (simple geometric shapes)
const cityBuildings = [];
const buildingColors = ['#1a0033', '#0d0022', '#220044', '#150030', '#200040'];
for (let i = 0; i < 40; i++) {
  const w = 20 + Math.random() * 60;
  const h = 30 + Math.random() * 140;
  cityBuildings.push({
    x: i * (GAME_WIDTH / 40) - 5,
    w: w,
    h: h,
    color: buildingColors[Math.floor(Math.random() * buildingColors.length)],
    windowRows: Math.floor(h / 12),
    windowCols: Math.floor(w / 8),
  });
}

function drawBackground(ctx) {
  // Base dark fill
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

  // Stars
  for (const star of stars) {
    star.twinkle += star.speed;
    const alpha = 0.3 + Math.sin(star.twinkle) * 0.4 + 0.3;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.r, 0, TWO_PI);
    ctx.fill();

    // Glow for brighter stars
    if (star.r > 1) {
      ctx.shadowColor = '#aaaaff';
      ctx.shadowBlur = 2;
      ctx.fill();
    }
    ctx.restore();
  }

  // Neon city skyline at bottom
  const cityBaseY = GAME_HEIGHT - 20;
  for (const b of cityBuildings) {
    const by = cityBaseY - b.h;

    // Building body
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, by, b.w, b.h);

    // Neon top line
    ctx.strokeStyle = '#aa00ff';
    ctx.lineWidth = 1;
    ctx.shadowColor = '#aa00ff';
    ctx.shadowBlur = 3;
    ctx.beginPath();
    ctx.moveTo(b.x, by);
    ctx.lineTo(b.x + b.w, by);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Windows
    for (let wr = 0; wr < b.windowRows; wr++) {
      for (let wc = 0; wc < b.windowCols; wc++) {
        const wx = b.x + 4 + wc * 8;
        const wy = by + 6 + wr * 12;
        if (Math.random() > 0.3) {
          const wAlpha = 0.2 + Math.random() * 0.4;
          const wColors = ['#ff00aa', '#00ffff', '#ffcc00', '#ff6600', '#aa99ff'];
          ctx.fillStyle = wColors[Math.floor(Math.random() * wColors.length)];
          ctx.globalAlpha = wAlpha;
          ctx.fillRect(wx, wy, 5, 4);
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  // Ground line
  ctx.strokeStyle = '#aa00ff';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#aa00ff';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(0, cityBaseY);
  ctx.lineTo(GAME_WIDTH, cityBaseY);
  ctx.stroke();
  ctx.shadowBlur = 0;
}

// ============================================================
//  WALL GLOW (border)
// ============================================================
function drawWalls(ctx) {
  ctx.save();
  ctx.strokeStyle = '#aa00ff';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#aa00ff';
  ctx.shadowBlur = 10;

  // Left
  ctx.beginPath();
  ctx.moveTo(1, 0);
  ctx.lineTo(1, GAME_HEIGHT);
  ctx.stroke();

  // Right
  ctx.beginPath();
  ctx.moveTo(GAME_WIDTH - 1, 0);
  ctx.lineTo(GAME_WIDTH - 1, GAME_HEIGHT);
  ctx.stroke();

  // Top
  ctx.beginPath();
  ctx.moveTo(0, 1);
  ctx.lineTo(GAME_WIDTH, 1);
  ctx.stroke();

  ctx.restore();
}

// ============================================================
//  HUD
// ============================================================
function drawHUD(ctx) {
  const y = 24;

  // Score
  ctx.save();
  ctx.font = 'bold 18px "Courier New", monospace';
  ctx.textAlign = 'left';

  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 8;
  ctx.fillStyle = '#00ffff';
  ctx.fillText('SCORE', 20, y);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(score.toString().padStart(7, '0'), 85, y);

  // High Score
  ctx.textAlign = 'center';
  ctx.shadowColor = '#ffcc00';
  ctx.shadowBlur = 6;
  ctx.fillStyle = '#ffcc00';
  ctx.fillText('HI', GAME_WIDTH / 2, y);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(highScore.toString().padStart(7, '0'), GAME_WIDTH / 2 + 28, y);

  // Lives (right side)
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ff0044';
  ctx.shadowColor = '#ff0044';
  ctx.shadowBlur = 6;
  let livesStr = '';
  for (let i = 0; i < lives; i++) livesStr += '♥ ';
  ctx.fillText(livesStr.trim(), GAME_WIDTH - 20, y);
  ctx.shadowBlur = 0;

  // Level indicator
  ctx.textAlign = 'center';
  ctx.font = '11px "Courier New", monospace';
  ctx.fillStyle = '#aa00ff';
  ctx.shadowColor = '#aa00ff';
  ctx.shadowBlur = 4;
  ctx.fillText('LEVEL ' + level, GAME_WIDTH / 2, y + 18);
  ctx.shadowBlur = 0;

  // Power-up status bar
  let statusY = GAME_HEIGHT - 16;
  ctx.font = '10px "Courier New", monospace';
  ctx.textAlign = 'left';

  if (paddle.wideTimer > 0) {
    const sec = Math.ceil(paddle.wideTimer / 60);
    ctx.fillStyle = '#00ffff';
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 4;
    ctx.fillText('⬅➡ WIDE ' + sec + 's', 20, statusY);
    ctx.shadowBlur = 0;
    statusY -= 16;
  }

  for (const b of balls) {
    if (b.active && b.slowTimer > 0) {
      const sec = Math.ceil(b.slowTimer / 60);
      ctx.fillStyle = '#ffcc00';
      ctx.shadowColor = '#ffcc00';
      ctx.shadowBlur = 4;
      ctx.fillText('🐌 SLOW ' + sec + 's', 20, statusY);
      ctx.shadowBlur = 0;
      break;
    }
  }

  ctx.restore();
}

// ============================================================
//  SCREEN OVERLAYS
// ============================================================
function drawStartScreen(ctx) {
  // Dim overlay
  ctx.fillStyle = 'rgba(10, 10, 26, 0.7)';
  ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

  ctx.save();
  ctx.textAlign = 'center';

  // Title
  ctx.font = 'bold 52px "Courier New", monospace';
  ctx.shadowColor = '#aa00ff';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#ffffff';
  ctx.fillText('NEON', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 60);
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 20;
  ctx.fillText('BREAKOUT', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 10);

  // Subtitle
  ctx.shadowBlur = 0;
  ctx.font = '14px "Courier New", monospace';
  ctx.fillStyle = '#aa00ff';
  ctx.fillText('CYBERPUNK ARKANOID', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 20);

  // Instructions
  const pulse = Math.sin(frameCount * 0.05) * 0.4 + 0.6;
  ctx.globalAlpha = pulse;
  ctx.font = '16px "Courier New", monospace';
  ctx.fillStyle = '#00ffff';
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 8;
  ctx.fillText('[ 空格 / 点击开始 ]', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 80);

  // Controls hint
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 0.5;
  ctx.font = '11px "Courier New", monospace';
  ctx.fillStyle = '#888888';
  ctx.fillText('鼠标/触摸移动挡板  |  方向键辅助', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 110);

  ctx.restore();
}

function drawGameOverScreen(ctx) {
  ctx.fillStyle = 'rgba(10, 10, 26, 0.75)';
  ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

  ctx.save();
  ctx.textAlign = 'center';

  ctx.font = 'bold 44px "Courier New", monospace';
  ctx.shadowColor = '#ff0044';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#ff0044';
  ctx.fillText('GAME OVER', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 40);

  ctx.shadowBlur = 0;
  ctx.font = '20px "Courier New", monospace';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('SCORE: ' + score, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 10);
  ctx.fillStyle = '#ffcc00';
  ctx.fillText('BEST:  ' + highScore, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 36);

  const pulse = Math.sin(frameCount * 0.05) * 0.4 + 0.6;
  ctx.globalAlpha = pulse;
  ctx.font = '16px "Courier New", monospace';
  ctx.fillStyle = '#00ffff';
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 8;
  ctx.fillText('[ 空格 / 点击重新开始 ]', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 80);

  ctx.restore();
}

function drawLevelComplete(ctx) {
  ctx.fillStyle = 'rgba(10, 10, 26, 0.7)';
  ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

  ctx.save();
  ctx.textAlign = 'center';

  ctx.font = 'bold 36px "Courier New", monospace';
  ctx.shadowColor = '#00ff44';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#00ff44';
  ctx.fillText('LEVEL CLEAR!', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 20);

  ctx.shadowBlur = 0;
  ctx.font = '18px "Courier New", monospace';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('进入第 ' + (level + 1) + ' 关...', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 25);

  ctx.restore();
}

// ============================================================
//  SCORE FLASH
// ============================================================
function checkScoreMilestone() {
  const milestone = Math.floor(score / 1000) * 1000;
  if (milestone > 0 && score % 1000 < 10 && flashTarget === 0) {
    flashTarget = 1;
  }
}

// ============================================================
//  INPUT HANDLING
// ============================================================

// Mouse
canvas.addEventListener('mousemove', (e) => {
  if (gameState === STATE.PLAYING) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = GAME_WIDTH / rect.width;
    paddle.targetX = (e.clientX - rect.left) * scaleX;
  }
});

canvas.addEventListener('click', (e) => {
  if (gameState === STATE.START) {
    startGame();
  } else if (gameState === STATE.GAME_OVER) {
    resetGame();
  } else if (gameState === STATE.LEVEL_DONE) {
    // Let it auto-transition
  }
});

// Touch
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (gameState === STATE.PLAYING) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = GAME_WIDTH / rect.width;
    paddle.targetX = (e.touches[0].clientX - rect.left) * scaleX;
  }
}, { passive: false });

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (gameState === STATE.START) {
    startGame();
  } else if (gameState === STATE.GAME_OVER) {
    resetGame();
  } else if (gameState === STATE.PLAYING) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = GAME_WIDTH / rect.width;
    paddle.targetX = (e.touches[0].clientX - rect.left) * scaleX;
  }
}, { passive: false });

// Keyboard
const keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;

  if (e.code === 'Space') {
    e.preventDefault();
    if (gameState === STATE.START) {
      startGame();
    } else if (gameState === STATE.GAME_OVER) {
      resetGame();
    }
  }
});

window.addEventListener('keyup', (e) => {
  keys[e.code] = false;
});

function handleKeyboardInput() {
  if (gameState !== STATE.PLAYING) return;

  if (keys['ArrowLeft'] || keys['KeyA']) {
    paddle.targetX -= PADDLE_SPEED;
  }
  if (keys['ArrowRight'] || keys['KeyD']) {
    paddle.targetX += PADDLE_SPEED;
  }
}

// ============================================================
//  GAME LOGIC
// ============================================================
function startGame() {
  gameState = STATE.PLAYING;
  score = 0;
  lives = START_LIVES;
  level = 1;
  brickGrid = buildBrickGrid();
  paddle.reset();
  paddle.targetX = GAME_WIDTH / 2;
  balls.length = 1;
  balls[0] = new BallObj();
  // Launch ball upward with slight random angle
  const angle = (Math.random() - 0.5) * 0.8;
  balls[0].reset(GAME_WIDTH / 2, PADDLE_Y - BALL_RADIUS - 5, Math.sin(angle) * BALL_SPEED_BASE, -BALL_SPEED_BASE);
  // Reset power-ups
  for (const pu of powerUps) pu.active = false;
  flashAlpha = 0;
  flashTarget = 0;
}

function resetGame() {
  startGame();
}

function nextLevel() {
  level++;
  brickGrid = buildBrickGrid();
  paddle.reset();
  paddle.targetX = GAME_WIDTH / 2;

  // Increase ball speed slightly
  const speedMult = 1 + (level - 1) * 0.08;
  balls.length = 1;
  balls[0] = new BallObj();
  const angle = (Math.random() - 0.5) * 0.8;
  const spd = BALL_SPEED_BASE * speedMult;
  balls[0].reset(GAME_WIDTH / 2, PADDLE_Y - BALL_RADIUS - 5, Math.sin(angle) * spd, -spd);
  balls[0].speed = spd;

  for (const pu of powerUps) pu.active = false;
  paddle.wideTimer = 0;
  paddle.w = PADDLE_W_BASE;
}

/** Handle ball-brick collision response */
function handleBrickHit(ball, hit) {
  const brick = hit.brick;

  brick.hp--;

  // Spawn explosion
  spawnExplosion(
    brick.x + brick.w / 2,
    brick.y + brick.h / 2,
    brick.color,
    brick.glow,
    brick.hp <= 0 ? 16 : 8
  );

  if (brick.hp <= 0) {
    score += brick.points;
    checkScoreMilestone();

    // Possibly spawn power-up
    if (Math.random() < POWERUP_DROP_CHANCE) {
      spawnPowerUp(brick.x + brick.w / 2, brick.y + brick.h / 2);
    }
  }

  // Ball bounce: determine which side was hit
  // Use overlap resolution to push ball out
  const bx = brick.x;
  const by = brick.y;
  const bw = brick.w;
  const bh = brick.h;

  const ballLeft   = ball.x - BALL_RADIUS;
  const ballRight  = ball.x + BALL_RADIUS;
  const ballTop    = ball.y - BALL_RADIUS;
  const ballBottom = ball.y + BALL_RADIUS;

  // Overlap amounts
  const overlapLeft   = ballRight - bx;
  const overlapRight  = (bx + bw) - ballLeft;
  const overlapTop    = ballBottom - by;
  const overlapBottom = (by + bh) - ballTop;

  // Find smallest overlap
  const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

  if (minOverlap === overlapLeft || minOverlap === overlapRight) {
    ball.vx = -ball.vx;
    // Push ball out horizontally
    if (minOverlap === overlapLeft) {
      ball.x = bx - BALL_RADIUS;
    } else {
      ball.x = bx + bw + BALL_RADIUS;
    }
  } else {
    ball.vy = -ball.vy;
    // Push ball out vertically
    if (minOverlap === overlapTop) {
      ball.y = by - BALL_RADIUS;
    } else {
      ball.y = by + bh + BALL_RADIUS;
    }
  }
}

/** Handle power-up collision with paddle */
function handlePowerUpCollision(pu) {
  const halfW = paddle.w / 2;

  if (
    pu.y + POWERUP_SIZE >= paddle.y &&
    pu.y - POWERUP_SIZE <= paddle.y + paddle.h &&
    pu.x >= paddle.x - halfW &&
    pu.x <= paddle.x + halfW
  ) {
    // Apply effect
    switch (pu.type) {
      case 'WIDE':
        paddle.w = PADDLE_W_BASE * PADDLE_WIDE_MULT;
        paddle.wideTimer = PADDLE_WIDE_DUR;
        break;

      case 'MULTI': {
        // Clone each active ball
        const activeBalls = balls.filter(b => b.active);
        for (const b of activeBalls) {
          cloneBallFrom(b);
        }
        break;
      }

      case 'SLOW':
        for (const b of balls) {
          if (b.active) {
            b.speed = BALL_SPEED_SLOW;
            b.slowTimer = BALL_SLOW_DUR;
            // Preserve direction, adjust magnitude
            const mag = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
            if (mag > 0) {
              const ratio = BALL_SPEED_SLOW / mag;
              b.vx *= ratio;
              b.vy *= ratio;
            }
          }
        }
        break;
    }

    // Pickup effect
    spawnExplosion(pu.x, pu.y, POWERUP_TYPES[pu.type].color, POWERUP_TYPES[pu.type].glow, 8);
    pu.active = false;
  }
}

function update() {
  handleKeyboardInput();

  // Update paddle
  paddle.update();

  // Update balls
  for (const ball of balls) {
    if (!ball.active) continue;

    // Maintain speed
    const currentMag = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    if (currentMag > 0 && Math.abs(currentMag - ball.speed) > 0.01) {
      const ratio = ball.speed / currentMag;
      ball.vx *= ratio;
      ball.vy *= ratio;
    }

    ball.update();
    ball.checkPaddle(paddle);

    // Brick collision
    const hit = ball.checkBricks(brickGrid);
    if (hit) {
      handleBrickHit(ball, hit);
    }
  }

  // Remove inactive balls (bottom loss)
  let anyLost = false;
  for (const ball of balls) {
    if (ball.active && ball.y + BALL_RADIUS > GAME_HEIGHT) {
      spawnExplosion(ball.x, GAME_HEIGHT, '#ff0044', '#ff4488', 12);
      ball.active = false;
      anyLost = true;
    }
  }

  if (anyLost && activeBallCount() === 0) {
    lives--;
    if (lives <= 0) {
      gameState = STATE.GAME_OVER;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('neonBreakoutHighScore', highScore);
      }
    } else {
      // Respawn ball
      const mainBall = balls[0];
      const spd = mainBall.speed || BALL_SPEED_BASE;
      const angle = (Math.random() - 0.5) * 0.8;
      mainBall.reset(GAME_WIDTH / 2, PADDLE_Y - BALL_RADIUS - 5, Math.sin(angle) * spd, -spd);
      mainBall.speed = spd;
      // Reset other balls
      for (let i = 1; i < balls.length; i++) {
        balls[i].active = false;
      }
      // Reset paddle power-ups
      paddle.wideTimer = 0;
      paddle.w = PADDLE_W_BASE;
      // Kill active power-ups
      for (const pu of powerUps) pu.active = false;
      // Small shake
      shakeAmount = 4;
    }
  }

  // Check level clear
  if (allBricksCleared() && gameState === STATE.PLAYING) {
    gameState = STATE.LEVEL_DONE;
    // Auto-transition after 2 seconds
    setTimeout(() => {
      if (gameState === STATE.LEVEL_DONE) {
        nextLevel();
        gameState = STATE.PLAYING;
      }
    }, 2000);
  }

  // Update power-ups
  for (const pu of powerUps) {
    if (pu.active) {
      pu.update();
      handlePowerUpCollision(pu);
    }
  }

  // Update particles
  for (const p of particlePool) {
    p.update();
  }

  // Flash effect
  if (flashTarget > 0) {
    flashAlpha += 0.05;
    if (flashAlpha >= 1) {
      flashTarget = -1; // fade out
    }
  }
  if (flashTarget < 0) {
    flashAlpha -= 0.03;
    if (flashAlpha <= 0) {
      flashAlpha = 0;
      flashTarget = 0;
    }
  }

  // Shake decay
  if (shakeAmount > 0) {
    shakeAmount *= 0.85;
    if (shakeAmount < 0.2) shakeAmount = 0;
  }
}

// ============================================================
//  RENDER
// ============================================================
function render() {
  ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

  // Screen shake offset
  let shakeX = 0, shakeY = 0;
  if (shakeAmount > 0) {
    shakeX = (Math.random() - 0.5) * shakeAmount * 2;
    shakeY = (Math.random() - 0.5) * shakeAmount * 2;
  }

  ctx.save();
  ctx.translate(shakeX, shakeY);

  // Background
  drawBackground(ctx);

  // Walls glow
  drawWalls(ctx);

  // Bricks
  drawBricks(ctx);

  // Particles (behind game objects so they don't obscure)
  for (const p of particlePool) {
    p.draw(ctx);
  }

  // Power-ups
  for (const pu of powerUps) {
    if (pu.active) pu.draw(ctx);
  }

  // Paddle
  paddle.draw(ctx);

  // Balls
  for (const ball of balls) {
    if (ball.active) ball.draw(ctx);
  }

  ctx.restore(); // restore shake translation

  // HUD (not affected by shake)
  drawHUD(ctx);

  // Flash overlay
  if (flashAlpha > 0) {
    ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha * 0.15})`;
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
  }

  // Screen overlays
  if (gameState === STATE.START) {
    drawStartScreen(ctx);
  } else if (gameState === STATE.GAME_OVER) {
    drawGameOverScreen(ctx);
  } else if (gameState === STATE.LEVEL_DONE) {
    drawLevelComplete(ctx);
  }
}

// ============================================================
//  GAME LOOP
// ============================================================
function gameLoop() {
  frameCount++;

  if (gameState === STATE.PLAYING || gameState === STATE.LEVEL_DONE) {
    update();
  }

  render();
  requestAnimationFrame(gameLoop);
}

// ============================================================
//  INITIALIZE
// ============================================================
brickGrid = buildBrickGrid();
gameLoop();

console.log('%c🚀 NEON BREAKOUT %cready',
  'color:#00ffff;font-size:18px;',
  'color:#aa00ff;');
console.log('%c  Cyberpunk Arkanoid — Press SPACE or tap to start',
  'color:#888;');
</script>
