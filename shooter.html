<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>霓虹猎手 - Neon Shooter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #050510;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #gameCanvas {
    display: block;
    margin: 0 auto;
    background: #0a0a1a;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
// ============================================================
// 霓虹猎手 (Neon Shooter) - 竖版卷轴射击游戏
// 纯 HTML5 + Canvas + JavaScript 实现
// ============================================================

(() => {
'use strict';

// ==================== 常量定义 ====================
const BG_COLOR = '#0a0a1a';
const CYAN = '#00ffff';
const MAGENTA = '#ff00ff';
const ORANGE = '#ff8800';
const RED = '#ff0044';
const WHITE = '#ffffff';
const SHIELD_COLOR = '#00ff88';
const BOMB_COLOR = '#ffaa00';

const PLAYER_SPEED = 320;         // 像素/秒
const BULLET_SPEED = 600;
const ENEMY_BULLET_SPEED = 280;
const SHOOT_INTERVAL = 0.12;      // 秒，连射间隔
const INVINCIBLE_TIME = 2.0;      // 无敌时间秒
const POWERUP_DROP_RATE = 0.15;   // 道具掉落概率
const TRIPLE_DURATION = 8.0;
const SHIELD_DURATION = 10.0;
const BOSS_SCORE_INTERVAL = 1000; // 每1000分出Boss
const PLAYER_MAX_HP = 3;
const PLAYER_LIVES = 3;

// ==================== Canvas 初始化 ====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H, scale;

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const maxW = 480;
  const maxH = 800;
  const ratio = maxW / maxH;

  let cw = window.innerWidth;
  let ch = window.innerHeight;

  if (cw / ch > ratio) {
    cw = ch * ratio;
  } else {
    ch = cw / ratio;
  }

  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  canvas.width = Math.floor(cw * dpr);
  canvas.height = Math.floor(ch * dpr);

  W = canvas.width;
  H = canvas.height;
  scale = W / maxW;
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ==================== 工具函数 ====================
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function dist(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}
function rectCollide(a, b) {
  return a.x - a.w / 2 < b.x + b.w / 2 &&
         a.x + a.w / 2 > b.x - b.w / 2 &&
         a.y - a.h / 2 < b.y + b.h / 2 &&
         a.y + a.h / 2 > b.y - b.h / 2;
}

// 发光文字绘制
function drawGlowText(text, x, y, size, color, align, glow) {
  ctx.save();
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  const blur = glow || size * 0.6;
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.shadowBlur = blur * 0.5;
  ctx.fillText(text, x, y);
  ctx.shadowBlur = 0;
  ctx.fillStyle = WHITE;
  ctx.globalAlpha = 0.4;
  ctx.fillText(text, x, y);
  ctx.restore();
}

// ==================== 对象池 ====================
class ObjectPool {
  constructor(factory, resetFn, initialSize) {
    this.factory = factory;
    this.resetFn = resetFn;
    this.pool = [];
    this.active = [];
    for (let i = 0; i < (initialSize || 0); i++) {
      this.pool.push(this.factory());
    }
  }

  get() {
    let obj = this.pool.pop();
    if (!obj) obj = this.factory();
    this.active.push(obj);
    return obj;
  }

  release(obj) {
    const idx = this.active.indexOf(obj);
    if (idx !== -1) {
      this.active.splice(idx, 1);
      this.resetFn(obj);
      this.pool.push(obj);
    }
  }

  releaseAll() {
    while (this.active.length > 0) {
      const obj = this.active.pop();
      this.resetFn(obj);
      this.pool.push(obj);
    }
  }

  getActive() { return this.active; }
}

// ==================== 粒子系统 ====================
const particlePool = new ObjectPool(
  () => ({ x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 0, color: '', size: 0, type: 'normal' }),
  (p) => { p.life = 0; p.type = 'normal'; },
  200
);

function spawnParticles(x, y, color, count, speedMin, speedMax, sizeMin, sizeMax, lifeMin, lifeMax) {
  for (let i = 0; i < count; i++) {
    const p = particlePool.get();
    const angle = rand(0, Math.PI * 2);
    const speed = rand(speedMin, speedMax);
    p.x = x;
    p.y = y;
    p.vx = Math.cos(angle) * speed;
    p.vy = Math.sin(angle) * speed;
    p.life = rand(lifeMin, lifeMax);
    p.maxLife = p.life;
    p.color = color;
    p.size = rand(sizeMin, sizeMax);
    p.type = 'normal';
  }
}

function spawnRingParticles(x, y, color, count, radius, size, life) {
  for (let i = 0; i < count; i++) {
    const p = particlePool.get();
    const angle = (i / count) * Math.PI * 2;
    p.x = x + Math.cos(angle) * radius * 0.3;
    p.y = y + Math.sin(angle) * radius * 0.3;
    p.vx = Math.cos(angle) * radius * 2;
    p.vy = Math.sin(angle) * radius * 2;
    p.life = life;
    p.maxLife = life;
    p.color = color;
    p.size = size;
    p.type = 'ring';
  }
}

function updateParticles(dt) {
  const active = particlePool.getActive();
  for (let i = active.length - 1; i >= 0; i--) {
    const p = active[i];
    p.life -= dt;
    if (p.life <= 0) {
      particlePool.release(p);
      continue;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.98;
    p.vy *= 0.98;
  }
}

function drawParticles() {
  const active = particlePool.getActive();
  for (let i = 0; i < active.length; i++) {
    const p = active[i];
    const alpha = clamp(p.life / p.maxLife, 0, 1);
    const sz = p.size * scale * alpha;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = sz * 2;
    ctx.fillStyle = p.color;
    if (p.type === 'ring') {
      ctx.beginPath();
      ctx.arc(p.x, p.y, sz, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
    }
    ctx.restore();
  }
}

// ==================== 子弹系统 ====================
const playerBulletPool = new ObjectPool(
  () => ({ x: 0, y: 0, vx: 0, vy: 0, w: 0, h: 0, alive: true }),
  (b) => { b.alive = false; },
  50
);

const enemyBulletPool = new ObjectPool(
  () => ({ x: 0, y: 0, vx: 0, vy: 0, w: 0, h: 0, alive: true, color: RED }),
  (b) => { b.alive = false; b.color = RED; },
  100
);

function spawnPlayerBullet(x, y, angle) {
  const b = playerBulletPool.get();
  b.x = x;
  b.y = y;
  b.vx = Math.sin(angle) * BULLET_SPEED * scale;
  b.vy = -Math.cos(angle) * BULLET_SPEED * scale;
  b.w = 4 * scale;
  b.h = 14 * scale;
  b.alive = true;
  return b;
}

function spawnEnemyBullet(x, y, vx, vy, color) {
  const b = enemyBulletPool.get();
  b.x = x;
  b.y = y;
  b.vx = vx;
  b.vy = vy;
  b.w = 6 * scale;
  b.h = 6 * scale;
  b.alive = true;
  b.color = color || RED;
  return b;
}

function updateBullets(pool, dt) {
  const active = pool.getActive();
  for (let i = active.length - 1; i >= 0; i--) {
    const b = active[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
      pool.release(b);
    }
  }
}

function drawPlayerBullets() {
  const active = playerBulletPool.getActive();
  for (let i = 0; i < active.length; i++) {
    const b = active[i];
    ctx.save();
    ctx.shadowColor = CYAN;
    ctx.shadowBlur = 10 * scale;
    ctx.fillStyle = CYAN;
    ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    ctx.shadowBlur = 5 * scale;
    ctx.fillStyle = WHITE;
    ctx.globalAlpha = 0.6;
    ctx.fillRect(b.x - b.w / 4, b.y - b.h / 2, b.w / 2, b.h);
    ctx.restore();
  }
}

function drawEnemyBullets() {
  const active = enemyBulletPool.getActive();
  for (let i = 0; i < active.length; i++) {
    const b = active[i];
    const r = b.w / 2;
    ctx.save();
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 8 * scale;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = WHITE;
    ctx.globalAlpha = 0.4;
    ctx.beginPath();
    ctx.arc(b.x, b.y, r * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ==================== 背景系统 ====================
const stars = [];
const buildings = [];

function initBackground() {
  stars.length = 0;
  buildings.length = 0;

  // 星星
  for (let i = 0; i < 80; i++) {
    stars.push({
      x: rand(0, 1),
      y: rand(0, 1),
      size: rand(0.5, 2),
      speed: rand(0.02, 0.08),
      brightness: rand(0.3, 1)
    });
  }

  // 霓虹城市建筑轮廓
  const buildingCount = 12;
  for (let i = 0; i < buildingCount; i++) {
    const bw = rand(0.04, 0.1);
    const bh = rand(0.05, 0.15);
    buildings.push({
      x: (i / buildingCount) + rand(-0.02, 0.02),
      w: bw,
      h: bh,
      color: [CYAN, MAGENTA, ORANGE, '#8844ff', '#44ff88'][randInt(0, 4)],
      windows: randInt(2, 5),
      pulse: rand(0, Math.PI * 2)
    });
  }
}
initBackground();

function drawBackground(dt) {
  // 背景色
  ctx.fillStyle = BG_COLOR;
  ctx.fillRect(0, 0, W, H);

  // 星空
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    s.y += s.speed * dt;
    if (s.y > 1) { s.y = 0; s.x = rand(0, 1); }
    const alpha = s.brightness * (0.5 + 0.5 * Math.sin(game.time * 2 + i));
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = WHITE;
    ctx.shadowColor = WHITE;
    ctx.shadowBlur = s.size * 3 * scale;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.size * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 城市轮廓 - 远景
  const cityY = H * 0.88;
  ctx.save();
  ctx.globalAlpha = 0.25;
  for (let i = 0; i < buildings.length; i++) {
    const b = buildings[i];
    b.pulse += dt;
    const bx = b.x * W;
    const bw = b.w * W;
    const bh = b.h * H;

    // 建筑体
    ctx.fillStyle = '#111122';
    ctx.fillRect(bx, cityY - bh, bw, bh);

    // 窗户灯光
    const wSize = 2 * scale;
    const wGap = bw / (b.windows + 1);
    const pulseAlpha = 0.5 + 0.5 * Math.sin(b.pulse * 1.5);
    ctx.fillStyle = b.color;
    ctx.globalAlpha = 0.2 + 0.15 * pulseAlpha;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 6 * scale;
    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < b.windows; col++) {
        ctx.fillRect(
          bx + wGap * (col + 0.5),
          cityY - bh + 6 * scale + row * 10 * scale,
          wSize, wSize
        );
      }
    }
  }
  ctx.restore();

  // 城市地面线
  ctx.save();
  ctx.strokeStyle = CYAN;
  ctx.globalAlpha = 0.15;
  ctx.shadowColor = CYAN;
  ctx.shadowBlur = 10 * scale;
  ctx.lineWidth = 1 * scale;
  ctx.beginPath();
  ctx.moveTo(0, cityY);
  ctx.lineTo(W, cityY);
  ctx.stroke();
  ctx.restore();
}

// ==================== 玩家飞机 ====================
const player = {
  x: 0, y: 0,
  w: 0, h: 0,
  hp: PLAYER_MAX_HP,
  lives: PLAYER_LIVES,
  invTimer: 0,
  shootTimer: 0,
  alive: true,
  // 道具状态
  tripleTimer: 0,
  shieldTimer: 0,
  // 尾焰粒子计时
  trailTimer: 0,

  reset() {
    this.x = W / 2;
    this.y = H * 0.82;
    this.w = 30 * scale;
    this.h = 36 * scale;
    this.hp = PLAYER_MAX_HP;
    this.lives = PLAYER_LIVES;
    this.invTimer = 0;
    this.shootTimer = 0;
    this.alive = true;
    this.tripleTimer = 0;
    this.shieldTimer = 0;
    this.trailTimer = 0;
  },

  update(dt) {
    // 移动
    let dx = 0, dy = 0;
    if (keys.left) dx -= 1;
    if (keys.right) dx += 1;
    if (keys.up) dy -= 1;
    if (keys.down) dy += 1;

    // 触摸控制
    if (touchActive) {
      const tx = touchX * W / (parseFloat(canvas.style.width) || W);
      const ty = touchY * H / (parseFloat(canvas.style.height) || H);
      const tdx = tx - this.x;
      const tdy = ty - this.y;
      const tdist = Math.sqrt(tdx * tdx + tdy * tdy);
      if (tdist > 5 * scale) {
        dx = tdx / tdist;
        dy = tdy / tdist;
      }
    }

    // 归一化斜向移动
    const len = Math.sqrt(dx * dx + dy * dy);
    if (len > 0) {
      dx /= len;
      dy /= len;
    }

    this.x += dx * PLAYER_SPEED * scale * dt;
    this.y += dy * PLAYER_SPEED * scale * dt;

    // 边界限制
    this.x = clamp(this.x, this.w / 2, W - this.w / 2);
    this.y = clamp(this.y, this.h / 2, H - this.h / 2);

    // 无敌计时
    if (this.invTimer > 0) this.invTimer -= dt;

    // 道具计时
    if (this.tripleTimer > 0) this.tripleTimer -= dt;
    if (this.shieldTimer > 0) this.shieldTimer -= dt;

    // 射击
    this.shootTimer -= dt;
    if ((keys.shoot || touchActive) && this.shootTimer <= 0) {
      this.shootTimer = SHOOT_INTERVAL;
      this.shoot();
    }

    // 尾焰粒子
    this.trailTimer -= dt;
    if (this.trailTimer <= 0) {
      this.trailTimer = 0.02;
      spawnParticles(
        this.x, this.y + this.h / 2,
        CYAN, 1,
        10 * scale, 40 * scale,
        2 * scale, 4 * scale,
        0.2, 0.4
      );
      // 额外内焰
      spawnParticles(
        this.x, this.y + this.h / 2,
        WHITE, 1,
        5 * scale, 20 * scale,
        1 * scale, 2 * scale,
        0.1, 0.2
      );
    }
  },

  shoot() {
    if (this.tripleTimer > 0) {
      // 三向弹
      spawnPlayerBullet(this.x, this.y - this.h / 2, 0);
      spawnPlayerBullet(this.x, this.y - this.h / 2, -0.25);
      spawnPlayerBullet(this.x, this.y - this.h / 2, 0.25);
    } else {
      spawnPlayerBullet(this.x, this.y - this.h / 2, 0);
    }
  },

  takeDamage() {
    if (this.invTimer > 0) return;

    // 护盾优先
    if (this.shieldTimer > 0) {
      this.shieldTimer = 0;
      spawnRingParticles(this.x, this.y, SHIELD_COLOR, 20, 30 * scale, 3 * scale, 0.4);
      return;
    }

    this.hp--;
    spawnParticles(this.x, this.y, WHITE, 15, 50 * scale, 150 * scale, 2 * scale, 5 * scale, 0.2, 0.5);

    if (this.hp <= 0) {
      this.lives--;
      if (this.lives <= 0) {
        this.alive = false;
        spawnParticles(this.x, this.y, CYAN, 50, 50 * scale, 250 * scale, 2 * scale, 6 * scale, 0.3, 0.8);
      } else {
        this.hp = PLAYER_MAX_HP;
        this.invTimer = INVINCIBLE_TIME;
      }
    } else {
      this.invTimer = INVINCIBLE_TIME;
    }
  },

  draw() {
    if (!this.alive) return;

    // 无敌闪烁
    if (this.invTimer > 0 && Math.floor(this.invTimer * 10) % 2 === 0) return;

    ctx.save();
    ctx.translate(this.x, this.y);

    // 护盾光环
    if (this.shieldTimer > 0) {
      const shieldAlpha = 0.3 + 0.2 * Math.sin(game.time * 6);
      ctx.save();
      ctx.globalAlpha = shieldAlpha;
      ctx.strokeStyle = SHIELD_COLOR;
      ctx.shadowColor = SHIELD_COLOR;
      ctx.shadowBlur = 15 * scale;
      ctx.lineWidth = 2 * scale;
      ctx.beginPath();
      ctx.arc(0, 0, this.w * 0.9, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, this.w * 0.9, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // 飞机主体发光
    ctx.shadowColor = CYAN;
    ctx.shadowBlur = 15 * scale;
    ctx.fillStyle = CYAN;
    ctx.strokeStyle = CYAN;
    ctx.lineWidth = 1.5 * scale;

    // 机身 - 尖锐的箭头形
    ctx.beginPath();
    ctx.moveTo(0, -this.h / 2);          // 顶点
    ctx.lineTo(-this.w / 3, -this.h / 6);
    ctx.lineTo(-this.w / 2, this.h / 3);
    ctx.lineTo(-this.w / 5, this.h / 5);
    ctx.lineTo(0, this.h / 2);            // 尾部
    ctx.lineTo(this.w / 5, this.h / 5);
    ctx.lineTo(this.w / 2, this.h / 3);
    ctx.lineTo(this.w / 3, -this.h / 6);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 内部细节线
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = WHITE;
    ctx.beginPath();
    ctx.moveTo(0, -this.h / 2 + 4 * scale);
    ctx.lineTo(-this.w / 6, this.h / 8);
    ctx.lineTo(0, this.h / 6);
    ctx.lineTo(this.w / 6, this.h / 8);
    ctx.closePath();
    ctx.fill();

    // 引擎光点
    ctx.globalAlpha = 0.8 + 0.2 * Math.sin(game.time * 20);
    ctx.fillStyle = WHITE;
    ctx.shadowColor = CYAN;
    ctx.shadowBlur = 8 * scale;
    ctx.beginPath();
    ctx.arc(0, this.h / 2 - 2 * scale, 2.5 * scale, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
};

// ==================== 敌机系统 ====================
const enemies = [];

class Enemy {
  constructor() {
    this.x = 0; this.y = 0;
    this.w = 0; this.h = 0;
    this.hp = 0; this.maxHp = 0;
    this.speed = 0;
    this.score = 0;
    this.type = 'small';
    this.alive = true;
    this.vx = 0;
    this.shootTimer = 0;
    this.shootInterval = 2;
    this.wobbleTimer = 0;
    this.wobbleAmp = 0;
    this.pattern = 0;
    this.patternTimer = 0;
    this.pulse = 0;
  }

  init(type, x, y, speedMul) {
    this.type = type;
    this.alive = true;
    this.x = x;
    this.y = y;
    this.wobbleTimer = rand(0, Math.PI * 2);
    this.pulse = 0;
    this.patternTimer = 0;
    this.pattern = 0;

    const sm = speedMul || 1;

    switch (type) {
      case 'small':
        this.w = 18 * scale;
        this.h = 18 * scale;
        this.hp = 1;
        this.maxHp = 1;
        this.speed = 200 * scale * sm;
        this.score = 100;
        this.vx = 0;
        this.shootTimer = 999;
        this.shootInterval = 999;
        this.wobbleAmp = 0;
        break;
      case 'medium':
        this.w = 28 * scale;
        this.h = 28 * scale;
        this.hp = 3;
        this.maxHp = 3;
        this.speed = 120 * scale * sm;
        this.score = 300;
        this.vx = 0;
        this.shootTimer = rand(0.5, 1.5);
        this.shootInterval = rand(1.5, 3);
        this.wobbleAmp = 60 * scale;
        break;
      case 'boss':
        this.w = 60 * scale;
        this.h = 50 * scale;
        this.hp = 20;
        this.maxHp = 20;
        this.speed = 40 * scale * sm;
        this.score = 2000;
        this.vx = 60 * scale;
        this.shootTimer = 1;
        this.shootInterval = 0.8;
        this.wobbleAmp = 0;
        this.pattern = 0;
        break;
    }
    return this;
  }

  update(dt) {
    this.pulse += dt;

    switch (this.type) {
      case 'small':
        this.y += this.speed * dt;
        break;
      case 'medium':
        this.y += this.speed * dt;
        this.wobbleTimer += dt * 2;
        this.x += Math.sin(this.wobbleTimer) * this.wobbleAmp * dt;
        this.x = clamp(this.x, this.w / 2, W - this.w / 2);
        // 射击
        this.shootTimer -= dt;
        if (this.shootTimer <= 0) {
          this.shootTimer = this.shootInterval;
          spawnEnemyBullet(this.x, this.y + this.h / 2, 0, ENEMY_BULLET_SPEED * scale, ORANGE);
        }
        break;
      case 'boss':
        // Boss 移动模式
        this.y += this.speed * dt;
        if (this.y > H * 0.18) {
          this.y = H * 0.18;
          this.x += this.vx * dt;
          if (this.x < this.w / 2 + 20 * scale) { this.x = this.w / 2 + 20 * scale; this.vx = Math.abs(this.vx); }
          if (this.x > W - this.w / 2 - 20 * scale) { this.x = W - this.w / 2 - 20 * scale; this.vx = -Math.abs(this.vx); }
        }

        // 弹幕模式
        this.patternTimer += dt;
        this.shootTimer -= dt;
        if (this.shootTimer <= 0) {
          const pType = Math.floor(this.patternTimer / 4) % 3;
          this.bossShoot(pType);
          this.shootTimer = this.shootInterval;
        }
        break;
    }

    // 超出屏幕
    if (this.y > H + 60 * scale) {
      this.alive = false;
    }
  }

  bossShoot(patternType) {
    const bx = this.x;
    const by = this.y + this.h / 2;

    switch (patternType) {
      case 0: // 扇形弹幕
        for (let i = -3; i <= 3; i++) {
          const angle = Math.PI / 2 + i * 0.2;
          spawnEnemyBullet(
            bx, by,
            Math.cos(angle) * ENEMY_BULLET_SPEED * scale,
            Math.sin(angle) * ENEMY_BULLET_SPEED * scale,
            RED
          );
        }
        break;
      case 1: // 瞄准弹
        {
          const dx = player.x - bx;
          const dy = player.y - by;
          const d = Math.sqrt(dx * dx + dy * dy) || 1;
          const speed = ENEMY_BULLET_SPEED * 1.2 * scale;
          spawnEnemyBullet(bx, by, (dx / d) * speed, (dy / d) * speed, ORANGE);
        }
        break;
      case 2: // 环形弹幕
        for (let i = 0; i < 12; i++) {
          const angle = (i / 12) * Math.PI * 2;
          spawnEnemyBullet(
            bx, by,
            Math.cos(angle) * ENEMY_BULLET_SPEED * 0.8 * scale,
            Math.sin(angle) * ENEMY_BULLET_SPEED * 0.8 * scale,
            MAGENTA
          );
        }
        break;
    }
  }

  draw() {
    if (!this.alive) return;
    ctx.save();
    ctx.translate(this.x, this.y);

    switch (this.type) {
      case 'small':
        this.drawSmall();
        break;
      case 'medium':
        this.drawMedium();
        break;
      case 'boss':
        this.drawBoss();
        break;
    }

    ctx.restore();
  }

  drawSmall() {
    ctx.shadowColor = MAGENTA;
    ctx.shadowBlur = 12 * scale;
    ctx.fillStyle = MAGENTA;

    // 倒三角
    ctx.beginPath();
    ctx.moveTo(0, this.h / 2);
    ctx.lineTo(-this.w / 2, -this.h / 2);
    ctx.lineTo(this.w / 2, -this.h / 2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = WHITE;
    ctx.globalAlpha = 0.3;
    ctx.lineWidth = 1 * scale;
    ctx.stroke();
  }

  drawMedium() {
    ctx.shadowColor = ORANGE;
    ctx.shadowBlur = 15 * scale;
    ctx.fillStyle = ORANGE;

    // 菱形
    ctx.beginPath();
    ctx.moveTo(0, -this.h / 2);
    ctx.lineTo(this.w / 2, 0);
    ctx.lineTo(0, this.h / 2);
    ctx.lineTo(-this.w / 2, 0);
    ctx.closePath();
    ctx.fill();

    // 内部X纹
    ctx.strokeStyle = WHITE;
    ctx.globalAlpha = 0.3;
    ctx.lineWidth = 1 * scale;
    ctx.beginPath();
    ctx.moveTo(-this.w / 4, -this.h / 4);
    ctx.lineTo(this.w / 4, this.h / 4);
    ctx.moveTo(this.w / 4, -this.h / 4);
    ctx.lineTo(-this.w / 4, this.h / 4);
    ctx.stroke();

    // HP条
    if (this.hp < this.maxHp) {
      ctx.globalAlpha = 0.8;
      ctx.shadowBlur = 0;
      const barW = this.w * 0.8;
      const barH = 3 * scale;
      ctx.fillStyle = '#333';
      ctx.fillRect(-barW / 2, -this.h / 2 - 8 * scale, barW, barH);
      ctx.fillStyle = ORANGE;
      ctx.shadowColor = ORANGE;
      ctx.shadowBlur = 4 * scale;
      ctx.fillRect(-barW / 2, -this.h / 2 - 8 * scale, barW * (this.hp / this.maxHp), barH);
    }
  }

  drawBoss() {
    const pulseScale = 1 + 0.05 * Math.sin(this.pulse * 4);
    ctx.scale(pulseScale, pulseScale);

    ctx.shadowColor = RED;
    ctx.shadowBlur = 25 * scale;
    ctx.fillStyle = RED;

    // 主体 - 六边形
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
      const px = Math.cos(angle) * this.w / 2;
      const py = Math.sin(angle) * this.h / 2;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();

    // 内圈
    ctx.fillStyle = '#880022';
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
      const px = Math.cos(angle) * this.w / 3.5;
      const py = Math.sin(angle) * this.h / 3.5;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();

    // 核心脉冲
    ctx.fillStyle = WHITE;
    ctx.globalAlpha = 0.4 + 0.3 * Math.sin(this.pulse * 6);
    ctx.shadowColor = RED;
    ctx.shadowBlur = 10 * scale;
    ctx.beginPath();
    ctx.arc(0, 0, 6 * scale, 0, Math.PI * 2);
    ctx.fill();

    // 翼尖装饰
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = ORANGE;
    ctx.shadowColor = ORANGE;
    ctx.shadowBlur = 8 * scale;
    ctx.beginPath();
    ctx.arc(-this.w / 2 - 5 * scale, 0, 4 * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(this.w / 2 + 5 * scale, 0, 4 * scale, 0, Math.PI * 2);
    ctx.fill();

    // HP条
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    const barW = this.w * 1.2;
    const barH = 5 * scale;
    ctx.fillStyle = '#333';
    ctx.fillRect(-barW / 2, -this.h / 2 - 14 * scale, barW, barH);
    ctx.fillStyle = RED;
    ctx.shadowColor = RED;
    ctx.shadowBlur = 4 * scale;
    ctx.fillRect(-barW / 2, -this.h / 2 - 14 * scale, barW * (this.hp / this.maxHp), barH);
  }

  hit() {
    this.hp--;
    // 受击闪光粒子
    spawnParticles(this.x, this.y, WHITE, 3, 30 * scale, 80 * scale, 1 * scale, 3 * scale, 0.1, 0.2);

    if (this.hp <= 0) {
      this.alive = false;
      this.explode();
      return true;
    }
    return false;
  }

  explode() {
    const color = this.type === 'small' ? MAGENTA :
                  this.type === 'medium' ? ORANGE : RED;
    const count = this.type === 'boss' ? 80 : (this.type === 'medium' ? 30 : 15);
    const spdMin = this.type === 'boss' ? 80 * scale : 50 * scale;
    const spdMax = this.type === 'boss' ? 400 * scale : 200 * scale;

    spawnParticles(this.x, this.y, color, count, spdMin, spdMax, 2 * scale, 6 * scale, 0.3, 0.9);

    if (this.type === 'boss') {
      // Boss 大爆炸 + 屏幕震动
      spawnParticles(this.x, this.y, ORANGE, 40, 100 * scale, 300 * scale, 3 * scale, 8 * scale, 0.5, 1.2);
      spawnParticles(this.x, this.y, WHITE, 20, 60 * scale, 200 * scale, 2 * scale, 5 * scale, 0.3, 0.7);
      spawnRingParticles(this.x, this.y, RED, 30, 60 * scale, 4 * scale, 0.6);
      game.shakeTimer = 0.5;
      game.shakeIntensity = 8 * scale;
    }

    // 掉落道具
    if (Math.random() < POWERUP_DROP_RATE || this.type === 'boss') {
      spawnPowerUp(this.x, this.y);
    }
  }
}

function spawnEnemy(type, speedMul) {
  const e = new Enemy();
  const x = rand(type === 'boss' ? W * 0.3 : 30 * scale, type === 'boss' ? W * 0.7 : W - 30 * scale);
  const y = -50 * scale;
  e.init(type, x, y, speedMul);
  enemies.push(e);
}

// ==================== 道具系统 ====================
const powerUps = [];

function spawnPowerUp(x, y) {
  const types = ['triple', 'shield', 'bomb'];
  const type = types[randInt(0, 2)];
  powerUps.push({
    x: x,
    y: y,
    w: 20 * scale,
    h: 20 * scale,
    type: type,
    speed: 80 * scale,
    pulse: 0,
    alive: true
  });
}

function updatePowerUps(dt) {
  for (let i = powerUps.length - 1; i >= 0; i--) {
    const p = powerUps[i];
    p.y += p.speed * dt;
    p.pulse += dt;
    if (p.y > H + 30 * scale) {
      powerUps.splice(i, 1);
      continue;
    }

    // 与玩家碰撞
    if (player.alive && rectCollide(player, p)) {
      applyPowerUp(p);
      // 拾取特效
      const color = p.type === 'triple' ? CYAN :
                    p.type === 'shield' ? SHIELD_COLOR : BOMB_COLOR;
      spawnRingParticles(p.x, p.y, color, 16, 25 * scale, 3 * scale, 0.3);
      powerUps.splice(i, 1);
    }
  }
}

function applyPowerUp(p) {
  switch (p.type) {
    case 'triple':
      player.tripleTimer = TRIPLE_DURATION;
      break;
    case 'shield':
      player.shieldTimer = SHIELD_DURATION;
      break;
    case 'bomb':
      // 清屏
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.alive) {
          e.alive = false;
          game.score += e.score;
          const color = e.type === 'small' ? MAGENTA : e.type === 'medium' ? ORANGE : RED;
          spawnParticles(e.x, e.y, color, 15, 50 * scale, 200 * scale, 2 * scale, 5 * scale, 0.3, 0.6);
        }
      }
      enemyBulletPool.releaseAll();
      // 炸弹特效
      spawnRingParticles(W / 2, H / 2, BOMB_COLOR, 40, 200 * scale, 5 * scale, 0.6);
      spawnParticles(W / 2, H / 2, WHITE, 40, 100 * scale, 400 * scale, 2 * scale, 6 * scale, 0.3, 0.8);
      game.shakeTimer = 0.3;
      game.shakeIntensity = 5 * scale;
      game.flashTimer = 0.15;
      break;
  }
}

function drawPowerUps() {
  for (let i = 0; i < powerUps.length; i++) {
    const p = powerUps[i];
    const pScale = 1 + 0.1 * Math.sin(p.pulse * 5);
    const color = p.type === 'triple' ? CYAN :
                  p.type === 'shield' ? SHIELD_COLOR : BOMB_COLOR;
    const label = p.type === 'triple' ? 'W' :
                  p.type === 'shield' ? 'S' : 'B';

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(pScale, pScale);

    // 光环
    ctx.globalAlpha = 0.3 + 0.2 * Math.sin(p.pulse * 5);
    ctx.strokeStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 15 * scale;
    ctx.lineWidth = 1.5 * scale;
    ctx.beginPath();
    ctx.arc(0, 0, p.w * 0.8, 0, Math.PI * 2);
    ctx.stroke();

    // 图标背景
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = color;
    ctx.shadowBlur = 10 * scale;
    ctx.beginPath();
    ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
    ctx.fill();

    // 文字
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.shadowBlur = 0;
    ctx.font = `bold ${12 * scale}px "Courier New", monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, 0, 1 * scale);

    ctx.restore();
  }
}

// ==================== HUD 绘制 ====================
function drawHUD() {
  ctx.save();

  // 分数
  drawGlowText(`${game.score}`, W / 2, 22 * scale, 18 * scale, CYAN, 'center');

  // 最高分
  ctx.globalAlpha = 0.5;
  drawGlowText(`HI ${game.highScore}`, W / 2, 42 * scale, 10 * scale, CYAN, 'center');
  ctx.globalAlpha = 1;

  // 生命
  for (let i = 0; i < player.lives; i++) {
    const lx = 20 * scale + i * 18 * scale;
    const ly = 22 * scale;
    ctx.save();
    ctx.translate(lx, ly);
    ctx.fillStyle = CYAN;
    ctx.shadowColor = CYAN;
    ctx.shadowBlur = 6 * scale;
    ctx.beginPath();
    ctx.moveTo(0, -5 * scale);
    ctx.lineTo(-4 * scale, 3 * scale);
    ctx.lineTo(4 * scale, 3 * scale);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // HP 条
  const hpBarW = 60 * scale;
  const hpBarH = 5 * scale;
  const hpBarX = 18 * scale;
  const hpBarY = 34 * scale;
  ctx.fillStyle = '#222';
  ctx.fillRect(hpBarX, hpBarY, hpBarW, hpBarH);
  const hpRatio = player.hp / PLAYER_MAX_HP;
  ctx.fillStyle = hpRatio > 0.5 ? CYAN : (hpRatio > 0.25 ? ORANGE : RED);
  ctx.shadowColor = ctx.fillStyle;
  ctx.shadowBlur = 4 * scale;
  ctx.fillRect(hpBarX, hpBarY, hpBarW * hpRatio, hpBarH);

  // 道具状态
  let statusY = 50 * scale;
  if (player.tripleTimer > 0) {
    drawGlowText(`W ${player.tripleTimer.toFixed(1)}s`, W - 20 * scale, statusY, 10 * scale, CYAN, 'right');
    statusY += 14 * scale;
  }
  if (player.shieldTimer > 0) {
    drawGlowText(`S ${player.shieldTimer.toFixed(1)}s`, W - 20 * scale, statusY, 10 * scale, SHIELD_COLOR, 'right');
    statusY += 14 * scale;
  }

  // 千分提示
  if (game.milestoneTimer > 0) {
    const alpha = clamp(game.milestoneTimer, 0, 1);
    ctx.globalAlpha = alpha;
    const sz = 24 * scale + (1 - alpha) * 10 * scale;
    drawGlowText(`${game.lastMilestone}!`, W / 2, H * 0.35, sz, BOMB_COLOR, 'center');
  }

  ctx.restore();
}

// ==================== 游戏状态 ====================
const game = {
  state: 'title',    // 'title', 'playing', 'gameover'
  score: 0,
  highScore: 0,
  time: 0,
  playTime: 0,
  difficultyMul: 1,
  spawnTimer: 0,
  lastBossScore: 0,
  shakeTimer: 0,
  shakeIntensity: 0,
  flashTimer: 0,
  milestoneTimer: 0,
  lastMilestone: 0,
  nextMilestone: 1000,

  init() {
    this.highScore = parseInt(localStorage.getItem('neonShooterHighScore') || '0', 10);
    this.state = 'title';
    this.score = 0;
    this.time = 0;
  },

  startGame() {
    this.state = 'playing';
    this.score = 0;
    this.playTime = 0;
    this.difficultyMul = 1;
    this.spawnTimer = 0;
    this.lastBossScore = 0;
    this.shakeTimer = 0;
    this.flashTimer = 0;
    this.milestoneTimer = 0;
    this.lastMilestone = 0;
    this.nextMilestone = 1000;

    // 清除所有实体
    enemies.length = 0;
    powerUps.length = 0;
    playerBulletPool.releaseAll();
    enemyBulletPool.releaseAll();
    particlePool.releaseAll();

    player.reset();
  },

  update(dt) {
    this.time += dt;

    if (this.state === 'playing') {
      this.playTime += dt;

      // 难度递增
      this.difficultyMul = 1 + this.playTime * 0.01;

      // 生成敌机
      this.spawnTimer -= dt;
      if (this.spawnTimer <= 0) {
        const baseInterval = 1.2;
        const interval = baseInterval / this.difficultyMul;
        this.spawnTimer = interval;

        // 根据时间决定敌机类型
        const r = Math.random();
        if (this.playTime > 30 && r < 0.08 * this.difficultyMul) {
          // 中型敌机
          spawnEnemy('medium', this.difficultyMul * 0.9);
        } else {
          // 小型敌机
          spawnEnemy('small', this.difficultyMul * 0.9);
        }

        // 额外的小型敌机（随难度增加）
        if (this.difficultyMul > 1.5 && Math.random() < 0.3) {
          spawnEnemy('small', this.difficultyMul * 0.9);
        }
        if (this.difficultyMul > 2.5 && Math.random() < 0.2) {
          spawnEnemy('small', this.difficultyMul * 0.9);
        }
        if (this.playTime > 20 && this.difficultyMul > 1.3 && Math.random() < 0.2) {
          spawnEnemy('medium', this.difficultyMul * 0.9);
        }
      }

      // Boss 生成
      const bossThreshold = this.lastBossScore + BOSS_SCORE_INTERVAL;
      if (this.score >= bossThreshold && this.playTime > 15) {
        this.lastBossScore = this.score;
        spawnEnemy('boss', this.difficultyMul * 0.8);
      }

      // 玩家更新
      player.update(dt);

      // 敌机更新
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.update(dt);
        if (!e.alive) {
          enemies.splice(i, 1);
        }
      }

      // 子弹更新
      updateBullets(playerBulletPool, dt);
      updateBullets(enemyBulletPool, dt);

      // 道具更新
      updatePowerUps(dt);

      // 碰撞检测：玩家子弹 vs 敌机
      const pBullets = playerBulletPool.getActive();
      for (let bi = pBullets.length - 1; bi >= 0; bi--) {
        const b = pBullets[bi];
        if (!b.alive) continue;
        for (let ei = enemies.length - 1; ei >= 0; ei--) {
          const e = enemies[ei];
          if (!e.alive) continue;
          if (rectCollide(b, e)) {
            playerBulletPool.release(b);
            const killed = e.hit();
            if (killed) {
              game.score += e.score;
              game.checkMilestone();
            }
            break;
          }
        }
      }

      // 碰撞检测：敌机子弹 vs 玩家
      if (player.alive) {
        const eBullets = enemyBulletPool.getActive();
        for (let bi = eBullets.length - 1; bi >= 0; bi--) {
          const b = eBullets[bi];
          if (!b.alive) continue;
          if (rectCollide(b, player)) {
            enemyBulletPool.release(b);
            player.takeDamage();
            if (!player.alive) {
              this.gameOver();
            }
            break;
          }
        }

        // 碰撞检测：敌机 vs 玩家
        for (let ei = enemies.length - 1; ei >= 0; ei--) {
          const e = enemies[ei];
          if (!e.alive) continue;
          if (rectCollide(e, player)) {
            player.takeDamage();
            // 敌机也受到伤害
            e.hp -= 2;
            if (e.hp <= 0) {
              e.alive = false;
              e.explode();
              this.score += e.score;
              this.checkMilestone();
            }
            if (!player.alive) {
              this.gameOver();
            }
            break;
          }
        }
      }

      // 屏幕震动
      if (this.shakeTimer > 0) this.shakeTimer -= dt;
      if (this.flashTimer > 0) this.flashTimer -= dt;
      if (this.milestoneTimer > 0) this.milestoneTimer -= dt;

      // 更新最高分
      if (this.score > this.highScore) {
        this.highScore = this.score;
        localStorage.setItem('neonShooterHighScore', this.highScore.toString());
      }
    }

    // 粒子始终更新
    updateParticles(dt);
  },

  checkMilestone() {
    if (this.score >= this.nextMilestone) {
      this.lastMilestone = this.nextMilestone;
      this.nextMilestone += 1000;
      this.milestoneTimer = 1.5;
    }
  },

  gameOver() {
    this.state = 'gameover';
    if (this.score > this.highScore) {
      this.highScore = this.score;
      localStorage.setItem('neonShooterHighScore', this.highScore.toString());
    }
  }
};

// ==================== 输入系统 ====================
const keys = { up: false, down: false, left: false, right: false, shoot: false };
let touchActive = false;
let touchX = 0, touchY = 0;

document.addEventListener('keydown', (e) => {
  switch (e.code) {
    case 'ArrowUp': case 'KeyW': keys.up = true; e.preventDefault(); break;
    case 'ArrowDown': case 'KeyS': keys.down = true; e.preventDefault(); break;
    case 'ArrowLeft': case 'KeyA': keys.left = true; e.preventDefault(); break;
    case 'ArrowRight': case 'KeyD': keys.right = true; e.preventDefault(); break;
    case 'Space':
      keys.shoot = true;
      e.preventDefault();
      if (game.state === 'title') game.startGame();
      else if (game.state === 'gameover') game.startGame();
      break;
  }
});

document.addEventListener('keyup', (e) => {
  switch (e.code) {
    case 'ArrowUp': case 'KeyW': keys.up = false; break;
    case 'ArrowDown': case 'KeyS': keys.down = false; break;
    case 'ArrowLeft': case 'KeyA': keys.left = false; break;
    case 'ArrowRight': case 'KeyD': keys.right = false; break;
    case 'Space': keys.shoot = false; break;
  }
});

// 触摸控制
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  touchX = t.clientX - rect.left;
  touchY = t.clientY - rect.top;
  touchActive = true;
  if (game.state === 'title') game.startGame();
  else if (game.state === 'gameover') game.startGame();
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  touchX = t.clientX - rect.left;
  touchY = t.clientY - rect.top;
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  touchActive = false;
}, { passive: false });

// 鼠标控制（PC端备用）
canvas.addEventListener('mousedown', (e) => {
  if (game.state === 'title') game.startGame();
  else if (game.state === 'gameover') game.startGame();
});

// ==================== 标题画面 ====================
function drawTitleScreen() {
  // 标题
  const titleY = H * 0.3;
  drawGlowText('NEON', W / 2, titleY - 24 * scale, 42 * scale, CYAN, 'center', 30 * scale);
  drawGlowText('SHOOTER', W / 2, titleY + 24 * scale, 42 * scale, MAGENTA, 'center', 30 * scale);

  // 副标题
  ctx.save();
  ctx.globalAlpha = 0.6;
  drawGlowText('霓虹猎手', W / 2, titleY + 70 * scale, 16 * scale, ORANGE, 'center');
  ctx.restore();

  // 闪烁提示
  const blink = Math.sin(game.time * 3) > 0;
  if (blink) {
    drawGlowText('PRESS SPACE TO START', W / 2, H * 0.58, 14 * scale, CYAN, 'center');
  }

  // 触摸提示
  ctx.save();
  ctx.globalAlpha = 0.4;
  drawGlowText('TOUCH TO START (MOBILE)', W / 2, H * 0.65, 10 * scale, CYAN, 'center');
  ctx.restore();

  // 操作说明
  const infoY = H * 0.76;
  ctx.save();
  ctx.globalAlpha = 0.5;
  drawGlowText('ARROW / WASD - MOVE', W / 2, infoY, 10 * scale, CYAN, 'center');
  drawGlowText('SPACE - SHOOT', W / 2, infoY + 16 * scale, 10 * scale, CYAN, 'center');
  drawGlowText('W - TRIPLE  S - SHIELD  B - BOMB', W / 2, infoY + 32 * scale, 10 * scale, ORANGE, 'center');
  ctx.restore();

  // 最高分
  if (game.highScore > 0) {
    drawGlowText(`HIGH SCORE: ${game.highScore}`, W / 2, H * 0.92, 12 * scale, BOMB_COLOR, 'center');
  }
}

// ==================== 游戏结束画面 ====================
function drawGameOverScreen() {
  // 半透明遮罩
  ctx.save();
  ctx.fillStyle = 'rgba(5, 5, 16, 0.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  drawGlowText('GAME OVER', W / 2, H * 0.32, 36 * scale, RED, 'center', 25 * scale);

  drawGlowText(`SCORE: ${game.score}`, W / 2, H * 0.44, 20 * scale, CYAN, 'center');
  drawGlowText(`HIGH SCORE: ${game.highScore}`, W / 2, H * 0.52, 14 * scale, BOMB_COLOR, 'center');

  if (game.score >= game.highScore && game.score > 0) {
    const pulse = 0.7 + 0.3 * Math.sin(game.time * 5);
    ctx.save();
    ctx.globalAlpha = pulse;
    drawGlowText('NEW RECORD!', W / 2, H * 0.6, 18 * scale, BOMB_COLOR, 'center');
    ctx.restore();
  }

  const blink = Math.sin(game.time * 3) > 0;
  if (blink) {
    drawGlowText('PRESS SPACE TO RETRY', W / 2, H * 0.72, 14 * scale, CYAN, 'center');
  }
}

// ==================== 主循环 ====================
let lastTime = 0;

function gameLoop(timestamp) {
  requestAnimationFrame(gameLoop);

  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  // 重新获取尺寸（如果resize发生）
  if (canvas.width !== W || canvas.height !== H) {
    // 玩家位置适配
    if (player.alive) {
      player.x = clamp(player.x, player.w / 2, W - player.w / 2);
      player.y = clamp(player.y, player.h / 2, H - player.h / 2);
    }
  }

  // 更新
  game.update(dt);

  // 绘制
  ctx.save();

  // 屏幕震动
  if (game.shakeTimer > 0) {
    const sx = (Math.random() - 0.5) * game.shakeIntensity * 2;
    const sy = (Math.random() - 0.5) * game.shakeIntensity * 2;
    ctx.translate(sx, sy);
  }

  // 背景
  drawBackground(dt);

  if (game.state === 'title') {
    drawTitleScreen();
  } else if (game.state === 'playing' || game.state === 'gameover') {
    // 游戏元素
    drawPlayerBullets();
    drawEnemyBullets();
    drawPowerUps();

    for (let i = 0; i < enemies.length; i++) {
      enemies[i].draw();
    }

    player.draw();
    drawParticles();
    drawHUD();

    // 炸弹闪屏
    if (game.flashTimer > 0) {
      ctx.save();
      ctx.globalAlpha = game.flashTimer / 0.15;
      ctx.fillStyle = WHITE;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    if (game.state === 'gameover') {
      drawGameOverScreen();
    }
  }

  ctx.restore();
}

// ==================== 启动 ====================
game.init();
requestAnimationFrame(gameLoop);

})();
</script>
